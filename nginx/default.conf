server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Don't reveal the nginx version in response headers and error pages
    server_tokens off;

    # Compress text responses; `gzip_vary` tells caches the response depends on Accept-Encoding
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built JS/CSS: file names contain a content hash (index-RUFmt1W1.css), so a changed
    # file always gets a new URL. They can be cached for a year without revalidation.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else, including index.html: always revalidate with the server, so a new
    # deploy is picked up immediately. Unchanged files still answer with a cheap 304.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
