# Security headers, included in every `location` block of default.conf.
# (An `add_header` inside a `location` drops all `add_header`s inherited from
# `server`, so they can't simply be set once at server level.)

# Only resources from this origin; no inline scripts or styles, no plugins, no framing
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Browsers must not guess content types (e.g. run a text file as a script)
add_header X-Content-Type-Options "nosniff" always;
# Send only the origin, not the full URL, to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The app needs none of these browser features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
