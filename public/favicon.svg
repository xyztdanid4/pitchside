<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="pitchside-logo-title">
  <title id="pitchside-logo-title">Pitchside</title>
  <defs>
    <clipPath id="badge">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="64" height="64" fill="#15803d" />
    <!-- mowing stripes -->
    <rect x="0" width="16" height="64" fill="#166534" />
    <rect x="32" width="16" height="64" fill="#166534" />
  </g>
  <!-- halfway line + centre circle forming a "P" -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M22 14 V50" />
    <circle cx="32" cy="24" r="10" />
  </g>
  <circle cx="32" cy="24" r="2.5" fill="#fff" />
</svg>
